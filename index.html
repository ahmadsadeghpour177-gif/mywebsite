<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050b16">
<title>SITel | راه‌های ارتباطی</title>
<style>
:root{color-scheme:dark;--bg:#050b16;--panel:#0b1527;--blue:#29a9ff;--cyan:#63e0ff;--text:#f4f8ff;--muted:#a9bad0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#102d52 0%,var(--bg) 58%);font-family:Tahoma,Arial,sans-serif;color:var(--text)}
main{width:min(100%,430px);text-align:center}
.logo{width:76px;height:76px;margin:0 auto 14px;border:1px solid #2e9fff;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,#102847,#07101e);box-shadow:0 0 28px #168bff30;font-size:22px;font-weight:800;letter-spacing:1px}
h1{font-size:30px;letter-spacing:2px;margin:0}
.sub{margin:8px 0 26px;color:var(--muted);font-size:14px}
.links{display:grid;gap:12px}
a.link{display:flex;align-items:center;gap:14px;text-decoration:none;text-align:right;padding:16px 18px;border:1px solid #1e3958;border-radius:16px;background:linear-gradient(120deg,#0d1b30,#091321);color:var(--text);transition:.15s}
a.link:hover{border-color:var(--blue);transform:translateY(-1px)}
.symbol{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#102b48;color:var(--cyan);font-size:20px;font-weight:bold;flex:none}
.label{font-size:16px;font-weight:700}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
footer{font-size:11px;color:#71849c;margin-top:24px}
</style>
</head>
<body>
<main>
  <div class="logo">SITel</div>
  <h1>SITel</h1>
  <p class="sub">راه‌های ارتباطی با فروشگاه</p>
  <div class="links">
    <a class="link" href="https://instagram.com/mobile.sitel" target="_blank" rel="noopener noreferrer"><span class="symbol">◎</span><span><div class="label">اینستاگرام</div><div class="hint">@mobile.sitel</div></span></a>
    <a class="link" href="https://t.me/Ahmad_sadeghpour" target="_blank" rel="noopener noreferrer"><span class="symbol">➤</span><span><div class="label">تلگرام</div><div class="hint">@Ahmad_sadeghpour</div></span></a>
    <!-- Before publishing, replace the placeholder below with the verified WhatsApp click-to-chat URL.
         WhatsApp wa.me links normally require the full phone number in international format, digits only. -->
    <a class="link" href="https://wa.me/REPLACE_WITH_INTERNATIONAL_PHONE_NUMBER" target="_blank" rel="noopener noreferrer"><span class="symbol">◉</span><span><div class="label">واتساپ</div><div class="hint">پیش از انتشار: شماره بین‌المللی را جایگزین کنید</div></span></a>
    <!-- Verify the Bale profile URL before printing or publishing the final QR. -->
    <a class="link" href="https://ble.ir/Ahmad-sadeghpour" target="_blank" rel="noopener noreferrer"><span class="symbol">ب</span><span><div class="label">بله</div><div class="hint">شناسه ارسالی: Ahmad-sadeghpour · نیازمند تأیید</div></span></a>
  </div>
  <footer>در ارتباط بمانید · SITel</footer>
</main>
</body>
</html>
